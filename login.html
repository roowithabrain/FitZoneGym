<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page - FitZone Gym</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>FitZone Gym - Login Page</h1>
    <form action="#" method="POST">

      <nav class="navbar">
        <div class="nav-container">
          <a href="homepage.html" class="back-btn" style="border: 1px solid; border-radius: 20px; padding: 5px 15px;">Go Back</a>
            <span class="navbar-brand">FitZone Gym</span>
        </div>
      </nav>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="btn">Login</button>
      <p class="switch">Don’t have an account? <a href="signup.html">Sign Up</a></p>
    </form>
  </div>
</body>
</html>
